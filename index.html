<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Session review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Iron and chalk. Same palette as the format proposal: plate steel, chalk
     dust, a cold blue signal. Semantic colours sit apart from the accent so
     "needs a decision" never competes with "this is a control". */
  :root {
    --ground:#EDEEEF; --surface:#FFFFFF; --surface-alt:#E3E5E7;
    --ink:#16191E; --ink-soft:#545C66; --ink-faint:#858D97;
    --rule:#CFD3D7; --accent:#2F6285; --accent-soft:#DCE7EF;
    --ok:#3F7D55; --warn:#9A6C16; --crit:#A63F34; --mono-bg:#F1F2F3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#101317; --surface:#191D23; --surface-alt:#21262E;
      --ink:#E8EAEC; --ink-soft:#A2ABB5; --ink-faint:#6E7883;
      --rule:#2E343C; --accent:#7FB2D6; --accent-soft:#1D2A34;
      --ok:#6FB98A; --warn:#D3A44A; --crit:#DE8175; --mono-bg:#141A20;
    }
  }
  :root[data-theme="dark"] {
    --ground:#101317; --surface:#191D23; --surface-alt:#21262E;
    --ink:#E8EAEC; --ink-soft:#A2ABB5; --ink-faint:#6E7883;
    --rule:#2E343C; --accent:#7FB2D6; --accent-soft:#1D2A34;
    --ok:#6FB98A; --warn:#D3A44A; --crit:#DE8175; --mono-bg:#141A20;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:20px}

  .eyebrow{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.14em;font-weight:600;font-size:12px;color:var(--accent);margin:0;
  }
  h1{
    font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:clamp(28px,7vw,40px);line-height:1.05;margin:4px 0 0;text-wrap:balance;
  }
  .sub{color:var(--ink-soft);font-size:15px;margin:2px 0 0}
  h2{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;
    text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);
    margin:0 0 10px;display:flex;align-items:center;gap:8px;
  }
  /* The section number is the structure made visible: overall, per exercise,
     approvals — in that order, on both surfaces. */
  h2 .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:2px;background:var(--accent);
    color:#fff;font-size:11px;letter-spacing:0;flex:none;
  }

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px}

  /* Severity stripes: state in form, not only in words. */
  .stripe{border-left:3px solid var(--rule);padding:10px 14px;background:var(--surface-alt);font-size:14.5px;color:var(--ink-soft);border-radius:0 3px 3px 0}
  .stripe.warn{border-left-color:var(--warn)}
  .stripe.act{border-left-color:var(--accent)}
  .stripe.crit{border-left-color:var(--crit)}
  .stripe strong{color:var(--ink);font-weight:600}

  .pill{
    display:inline-block;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.07em;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:2px;
    border:1px solid currentColor;white-space:nowrap;
  }
  .pill.ok{color:var(--ok)} .pill.up{color:var(--accent)}
  .pill.hold{color:var(--warn)} .pill.skip{color:var(--ink-faint)} .pill.bad{color:var(--crit)}

  .prop{border:1px solid var(--rule);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
  .prop + .prop{margin-top:10px}
  .prop.decided{opacity:.62}
  .prop .change{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
  .prop .why{font-size:14px;color:var(--ink-soft)}
  .prop .rule{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-faint)}

  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.1em;
    font-weight:600;font-size:13px;padding:11px 18px;border-radius:2px;cursor:pointer;
    border:1px solid var(--accent);background:var(--accent);color:#fff;min-height:44px;
  }
  button.ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
  button:disabled{opacity:.5;cursor:default}
  button:hover:not(:disabled){filter:brightness(1.08)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .critique{white-space:pre-wrap;font-size:15px;color:var(--ink-soft)}
  .critique strong{color:var(--ink)}

  /* Section 1 — the headline carries the verdict, so it is typeset as one. */
  .lede{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;
    font-size:clamp(19px,4.6vw,23px);line-height:1.2;color:var(--ink);
    margin:0 0 12px;text-wrap:balance;
  }
  .aside{margin-top:14px;border-left:3px solid var(--rule);padding:2px 0 2px 12px}
  .aside .k{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.12em;font-size:11px;color:var(--ink-faint);display:block;
  }
  .aside p{margin:2px 0 0;font-size:14.5px;color:var(--ink-soft);white-space:pre-wrap}

  /* Section 2 — one block per exercise rather than a table row: the numbers are
     only half of it now, and prose does not fit in a fifth column on a phone. */
  .ex{border-top:1px solid var(--rule);padding:14px 0}
  .ex:first-of-type{border-top:0;padding-top:0}
  .ex:last-of-type{padding-bottom:0}
  .ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .ex-id{font-weight:600;font-size:15.5px}
  .ex-nums{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
    font-size:12.5px;color:var(--ink-faint);margin-top:5px;
    display:flex;flex-wrap:wrap;gap:4px 14px;
  }
  .ex-nums b{color:var(--ink);font-weight:500}
  .ex-note{font-size:13.5px;color:var(--ink-faint);margin-top:7px}
  .ex-analysis{font-size:14.5px;color:var(--ink-soft);margin-top:7px}
  .ex-next{
    margin-top:9px;border-left:3px solid var(--accent);background:var(--surface-alt);
    padding:8px 11px;border-radius:0 3px 3px 0;font-size:14.5px;color:var(--ink);
  }
  .ex-next .k{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.12em;font-size:11px;color:var(--accent);display:block;
  }
  .withheld{margin-top:14px;font-size:14px;color:var(--ink-soft)}
  .withheld ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
  ol.q{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-soft);font-size:15px}

  .foot{color:var(--ink-faint);font-size:12.5px;text-align:center;line-height:1.6}
  .msg{padding:36px 16px;text-align:center;color:var(--ink-soft)}
  .msg h1{font-size:26px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="msg"><p class="eyebrow">Session review</p><h1>Loading…</h1></div>
</div>

<script>
// The publishable key is public by design; the credential here is the token in
// the URL. Supabase's gateway wants an apikey header even when the function
// itself does not verify a JWT.
const SUPABASE_URL = "https://ffgbgaycvrijvxjsixcj.supabase.co";
const PUBLISHABLE  = "sb_publishable_YApSSmtjFLARs4z6oUhWrw_j2V4emDz";

const token = new URLSearchParams(location.search).get("t");
const root  = document.getElementById("root");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const VERDICT = {
  met:            { label:"met",        cls:"ok"   },
  exceeded:       { label:"exceeded",   cls:"up"   },
  partially_met:  { label:"partial",    cls:"hold" },
  missed:         { label:"missed",     cls:"bad"  },
  not_performed:  { label:"skipped",    cls:"skip" },
};

function api(path, opts) {
  return fetch(`${SUPABASE_URL}/functions/v1/coach-report/${encodeURIComponent(token)}${path}`, {
    ...opts,
    headers: { "Content-Type":"application/json", apikey: PUBLISHABLE, ...(opts?.headers ?? {}) },
  });
}

function screen(title, detail) {
  root.innerHTML =
    `<div class="msg"><p class="eyebrow">Session review</p><h1>${esc(title)}</h1>` +
    (detail ? `<p class="sub">${esc(detail)}</p>` : "") + `</div>`;
}

function heading(n, title) {
  return `<h2><span class="num">${n}</span>${esc(title)}</h2>`;
}

/**
 * Reports are read back months after they were written. Ones stored before the
 * three-section split have a single `critique` blob and no `overall`, so they
 * are normalised into the same shape rather than rendering as an empty section.
 */
function overallOf(r) {
  const o = r.overall;
  if (o && ((o.headline ?? "").trim() || (o.summary ?? "").trim())) return o;
  return { headline: "", summary: r.critique ?? "" };
}

function aside(label, text) {
  return text && String(text).trim()
    ? `<div class="aside"><span class="k">${esc(label)}</span><p>${esc(text)}</p></div>`
    : "";
}

function overallSection(r) {
  const o = overallOf(r);
  const body = [
    o.headline?.trim() ? `<p class="lede">${esc(o.headline)}</p>` : "",
    o.summary?.trim() ? `<div class="critique">${esc(o.summary)}</div>` : "",
    aside("Readiness", o.readiness_note),
    aside("Programme", o.programme_note),
  ].filter(Boolean).join("");

  return `<section class="card">${heading(1, "Overall")}${
    body || `<p class="sub">No overall read was produced for this session.</p>`
  }</section>`;
}

/**
 * One block per exercise: verdict, the numbers side by side, then the reading
 * and — set apart, because it is the only line about the future — what to
 * emphasise next time.
 */
function exerciseBlock(s) {
  const v = VERDICT[s.verdict] ?? { label: s.verdict, cls: "skip" };
  const num = (label, value) => `<span>${esc(label)} <b>${esc(value)}</b></span>`;

  return `<div class="ex">
    <div class="ex-head">
      <span class="ex-id">${esc(s.exercise_id)}</span>
      <span class="pill ${v.cls}">${esc(v.label)}</span>
    </div>
    <div class="ex-nums">
      ${num("spec", s.spec)}${num("prev", s.previous ?? "—")}${num("this session", s.actual ?? "not logged")}
    </div>
    ${s.note ? `<div class="ex-note">${esc(s.note)}</div>` : ""}
    ${s.analysis ? `<div class="ex-analysis">${esc(s.analysis)}</div>` : ""}
    ${s.emphasis
      ? `<div class="ex-next"><span class="k">Next time</span>${esc(s.emphasis)}</div>`
      : ""}
  </div>`;
}

function exerciseSection(scores) {
  return `<section class="card">${heading(2, "Per exercise")}${
    scores?.length
      ? scores.map(exerciseBlock).join("")
      : `<p class="sub">No exercises to score — the spec has no entry for this session type.</p>`
  }</section>`;
}

function proposalCard(p) {
  const decided = p.status !== "proposed";
  const verb = { applied:"Approved", rejected:"Declined", superseded:"Superseded" }[p.status];
  return `<div class="prop ${decided ? "decided" : ""}" data-id="${esc(p.id)}">
    <div class="change">${esc(p.session_key)} · ${esc(p.exercise_id)} · ${esc(p.field)}
      ${esc(p.from_value)} → ${esc(p.to_value)}</div>
    <div class="why">${esc(p.rationale)}</div>
    <div class="rule">[${esc(p.rule_id)}]</div>
    ${decided
      ? `<div class="rule">${esc(verb)}${p.decided_via === "report_page" ? " here" : p.decided_via === "whatsapp_reaction" ? " by 👍" : ""}</div>`
      : `<div class="actions">
           <button data-act="approve">Approve</button>
           <button class="ghost" data-act="decline">Decline</button>
         </div>`}
  </div>`;
}

function render(state) {
  const r = state.report ?? {};
  const proposals = state.proposals ?? [];
  const pending = proposals.filter((p) => p.status === "proposed");
  const meta = [r.session_date, state.session_log_id].filter(Boolean).join(" · ");

  const validity = r.validity && r.validity.status !== "valid" && r.validity.reason
    ? `<div class="stripe warn"><strong>${r.validity.status === "invalid" ? "Not a valid capacity read" : "Partially valid"}.</strong> ${esc(r.validity.reason)}</div>`
    : "";

  const hygiene = (r.hygiene ?? []).map((h) =>
    `<div class="stripe crit"><strong>${esc(h.issue)}</strong><br>${esc(h.action)}</div>`).join("");

  const pendingBanner = pending.length
    ? `<div class="stripe act"><strong>${pending.length} change${pending.length > 1 ? "s" : ""} awaiting your decision</strong> in section 3 below. Approving writes to the training programme and posts a receipt to WhatsApp.</div>`
    : "";

  const questions = (r.open_questions ?? []).length
    ? `<section class="card"><h2>Open questions</h2><ol class="q">${
        r.open_questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ol>
       <p class="sub" style="margin-top:12px">Reply in the WhatsApp group to answer — the coach reads the group.</p></section>`
    : "";

  const withheld = (r.withheld ?? []).length
    ? `<div class="withheld"><strong>Withheld ${r.withheld.length} change${
        r.withheld.length > 1 ? "s" : ""}</strong> the session data does not support:
       <ul>${r.withheld.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`
    : "";

  // Section 3 renders even with nothing in it: "nothing was proposed" is a
  // result of the review, not an absence of one.
  const approvals = `<section class="card">${heading(3, "Progression approvals")}${
    proposals.length
      ? proposals.map(proposalCard).join("")
      : `<p class="sub">No programme changes proposed — the spec is unchanged.</p>`
  }${withheld}</section>`;

  root.innerHTML = `
    <header>
      <p class="eyebrow">Session review</p>
      <h1>${esc(r.session_label ?? "Session")}</h1>
      <p class="sub">${esc(meta)}</p>
    </header>
    ${pendingBanner}
    ${hygiene}
    ${validity}
    ${overallSection(r)}
    ${exerciseSection(r.scores)}
    ${approvals}
    ${r.annotation_note ? `<div class="stripe">${esc(r.annotation_note)}</div>` : ""}
    ${questions}
    <p class="foot">This link is private — anyone holding it can read this report<br>and approve the changes on it.</p>
  `;

  root.querySelectorAll("button[data-act]").forEach((btn) => {
    btn.addEventListener("click", () => decide(btn));
  });
}

async function decide(btn) {
  const card = btn.closest(".prop");
  const id = card.dataset.id;
  const act = btn.dataset.act;

  card.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  btn.textContent = act === "approve" ? "Applying…" : "Declining…";

  try {
    const res = await api(`/${act}`, { method:"POST", body: JSON.stringify({ proposal_id: id }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    // Re-render from what the server returned rather than patching our own copy,
    // so a change refused by the spec guard shows as refused and not as applied.
    render({ ...current, proposals: data.proposals ?? current.proposals });
    if (data.skipped) {
      root.insertAdjacentHTML("afterbegin",
        `<div class="stripe warn"><strong>Not applied.</strong> The programme has changed since this was proposed, so it was skipped rather than overwriting the newer value. Check WhatsApp for detail.</div>`);
    }
  } catch (err) {
    card.querySelectorAll("button").forEach((b) => { b.disabled = false; });
    btn.textContent = act === "approve" ? "Approve" : "Decline";
    card.insertAdjacentHTML("beforeend",
      `<div class="stripe crit"><strong>Didn't go through.</strong> ${esc(err.message)} — nothing was changed. Try again, or 👍 the WhatsApp message instead.</div>`);
  }
}

let current = null;

(async function load() {
  if (!token) return screen("No report link", "This page needs the link from your WhatsApp message.");
  try {
    const res = await api("");
    if (res.status === 404) return screen("Report not found", "The link may be mistyped, or this report no longer exists.");
    if (!res.ok) return screen("Couldn't load the report", `The server returned ${res.status}.`);
    current = await res.json();
    render(current);
  } catch (err) {
    screen("Couldn't load the report", "Check your connection and reload.");
  }
})();
</script>
</body>
</html>
